aid: divine
name: Divine
description: >-
  Divine Research Inc. is a fintech company building blockchain-based unsecured lending for
  underserved borrowers in emerging markets. Its flagship product, Credit, issues small
  stablecoin (USDC) loans that start small and can grow to $1,000 as borrowers build trust,
  with algorithmically set interest rates and default rates that have approached zero.
  Borrowers access loans through a World MiniApp, while liquidity providers supply capital
  and earn yield through the Credit Vault at credit.cash. As of late 2024 the platform had
  issued hundreds of thousands of loans to more than 500,000 borrowers. Divine is backed by
  Paradigm and was surfaced through its portfolio; this profile is maintained in the API
  Evangelist network. Divine currently publishes no public developer API, SDKs, or
  machine-readable API artifacts.
